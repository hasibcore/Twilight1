name: melody_tube
description: "Twilight - Fast music streaming and offline audio player with background playback."
publish_to: 'none'
version: 1.0.17+17

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State Management
  provider: ^6.1.2
  
  # Official YouTube Player Embed (Compliant iFrame wrapper)
  youtube_player_flutter: ^9.0.1
  
  # HTTP & API
  http: ^1.2.1
  
  # Local Storage & Persistence
  shared_preferences: ^2.2.3
  
  # Image Caching & UI
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.0
  intl: ^0.19.0
  uuid: ^4.4.0
  
  # Icons
  cupertino_icons: ^1.0.8
  youtube_explode_dart: ^3.1.0
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  path_provider: ^2.1.6
  just_audio_windows: ^0.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/
    - assets/images/
