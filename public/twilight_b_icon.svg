<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#110926" />
      <stop offset="50%" stop-color="#0a0518" />
      <stop offset="100%" stop-color="#1a0b36" />
    </linearGradient>

    <radialGradient id="cornerGlow" cx="420" cy="90" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8338ec" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#3a0ca3" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="ringGrad" x1="120" y1="120" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff3388" />
      <stop offset="25%" stop-color="#f72585" />
      <stop offset="55%" stop-color="#7209b7" />
      <stop offset="85%" stop-color="#3a86ff" />
      <stop offset="100%" stop-color="#4cc9f0" />
    </linearGradient>

    <linearGradient id="playGrad" x1="200" y1="190" x2="330" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff4088" />
      <stop offset="35%" stop-color="#d92588" />
      <stop offset="70%" stop-color="#7209b7" />
      <stop offset="100%" stop-color="#5327b8" />
    </linearGradient>

    <linearGradient id="orbitGrad" x1="100" y1="100" x2="410" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff2a85" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#9d4edd" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#3a86ff" stop-opacity="0.85" />
    </linearGradient>

    <filter id="neonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="url(#cornerGlow)" />
  <rect x="1" y="1" width="510" height="510" rx="111" stroke="white" stroke-width="2" stroke-opacity="0.08" />

  <circle cx="256" cy="256" r="162" fill="#0d0722" fill-opacity="0.8" />
  <circle cx="256" cy="256" r="162" stroke="url(#ringGrad)" stroke-width="1.5" stroke-opacity="0.25" />

  <circle cx="256" cy="256" r="164" stroke="url(#orbitGrad)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="980 60" stroke-dashoffset="180" opacity="0.9" />

  <circle cx="374" cy="188" r="13" fill="#ff2a85" filter="url(#dotGlow)" />

  <circle cx="256" cy="256" r="130" stroke="url(#ringGrad)" stroke-width="13" stroke-linecap="round" filter="url(#neonBloom)" />

  <path d="M 218 198 C 218 188 228 182 237 188 L 326 245 C 334 250 334 262 326 267 L 237 324 C 228 330 218 324 218 314 Z" fill="url(#playGrad)" filter="url(#neonBloom)" />
</svg>
